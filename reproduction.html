<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Reproduction</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview overview-detail-nav">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <a href="reproduction-index.html" class="breadcrumb-link" id="breadcrumb-reproduction-link">Reproduction</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current" id="breadcrumb-name">&#8230;</span>
      </nav>
      <div class="header-actions">
        <div class="paper-nav">
          <button id="prev-reproduction" title="Previous paper" disabled>&#9664;</button>
          <span id="reproduction-counter" class="dataset-counter">1 / 1</span>
          <button id="next-reproduction" title="Next paper" disabled>&#9654;</button>
        </div>
        <div class="account-menu hidden">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="detail-secondary-actions">
      <button id="copy-link-btn" class="copy-link-btn" title="Copy link to this reproduction" disabled>&#128279; Copy link</button>
      <button id="export-json-btn" class="copy-link-btn" title="Download this reproduction as JSON" disabled>&#8681; Download JSON</button>
    </div>

    <div id="locked-notice" class="locked-notice hidden">This reproduction is being edited by another user.</div>

    <div id="paper-info-section" class="stats-section detail-form">
      <div class="paper-info-header">
        <div class="stats-section-title">Paper</div>
        <a id="info-reviewing-link" href="#" target="_blank" rel="noopener noreferrer" class="review-link">Open in Reviewing &#8594;</a>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">ID</label>
        <div id="info-paper-id" class="field-display"></div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">Title</label>
        <div id="info-paper-title" class="field-display"></div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">Datasets</label>
        <table class="papers-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Available</th>
              <th>On Modal</th>
            </tr>
          </thead>
          <tbody id="info-datasets-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="dataset-form detail-form">
      <div class="dataset-form-group">
        <label class="dataset-form-label">Assignees</label>
        <div class="chip-container" id="assignees-chips"></div>
        <button type="button" id="assign-me-btn" class="text-action-btn" aria-pressed="false">Assign myself</button>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">Reproduction status</label>
        <div class="dataset-radio-group">
          <label><input type="radio" name="repro_status" value="finished"> Finished</label>
          <label><input type="radio" name="repro_status" value="in_progress"> In progress</label>
          <label><input type="radio" name="repro_status" value=""> Not started</label>
        </div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">URLs</label>
        <div id="url-chips" class="chip-container"></div>
        <div class="tag-input-row">
          <input type="text" id="url-input" class="field-input" placeholder="https://…">
          <button id="add-url-btn" class="btn-secondary">Add</button>
        </div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label" for="field-comments">Comments</label>
        <textarea id="field-comments" class="field-input dataset-textarea" rows="4" placeholder="Any notes about this reproduction attempt…"></textarea>
      </div>
    </div>

    <div class="detail-footer">
      <a href="reproduction-index.html" class="back-link">&#8592; Back</a>
      <div class="detail-footer-right">
        <span id="save-confirm" class="save-confirm hidden">Saved ✓</span>
        <button id="save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/reproduction/reproduction-detail.js"></script>
</body>
</html>
