<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLP Paper Survey — Metrics</title>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <div class="overview">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current">Metrics</span>
      </nav>
      <div class="header-actions">
        <div class="account-menu">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
        <button id="add-metric-btn" class="btn-primary">+ Add Metric</button>
      </div>
    </div>

    <div id="stats-row" class="stats-row"></div>

    <table class="papers-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>URL</th>
          <th>Comments</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="metrics-tbody"></tbody>
    </table>
  </div>

  <!-- Add / Edit modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-dialog modal-dialog-wide">
      <div class="modal-title" id="modal-title">Add Metric</div>
      <div id="modal-locked-notice" class="locked-notice hidden">This metric is being edited by another user.</div>

      <div class="dataset-form">
        <div class="dataset-form-group">
          <label class="dataset-form-label" for="modal-name">Name <span class="required-star">*</span></label>
          <input type="text" id="modal-name" class="field-input" placeholder="e.g. BLEU">
        </div>
        <div class="dataset-form-group">
          <label class="dataset-form-label">URLs</label>
          <div id="modal-url-chips" class="chip-container"></div>
          <div class="tag-input-row">
            <input type="text" id="modal-url-input" class="field-input" placeholder="https://…">
            <button id="modal-add-url-btn" class="btn-secondary">Add</button>
          </div>
        </div>
        <div class="dataset-form-group">
          <label class="dataset-form-label" for="modal-comments">Comments</label>
          <textarea id="modal-comments" class="field-input dataset-textarea" rows="3" placeholder="Any notes about this metric…"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="modal-save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=1"></script>
  <script src="js/metrics/metrics-overview.js?v=1"></script>
</body>
</html>
