<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Metrics</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current">Metrics</span>
      </nav>
      <div class="header-actions">
        <div class="account-menu">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
        <a href="metric.html" class="btn-primary btn-primary-link">+ Add Metric</a>
      </div>
    </div>

    <div id="stats-row" class="stats-row"></div>

    <table class="papers-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>URL</th>
          <th>Comments</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="metrics-tbody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/metrics/metrics-overview.js"></script>
</body>
</html>
