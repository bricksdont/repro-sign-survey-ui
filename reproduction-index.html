<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Reproduction Tracker</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview overview-wide">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current">Reproduction Tracker</span>
      </nav>
      <div class="header-actions">
        <div class="account-menu">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div id="stats-row" class="stats-row"></div>

    <div class="filter-bar">
      <div class="search-input-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Search by paper ID or title…">
        <button id="search-clear-btn" class="search-clear-btn hidden" type="button" aria-label="Clear search">&times;</button>
      </div>
      <select id="filter-status" class="filter-select">
        <option value="all">Reproduction status: All</option>
        <option value="not_started">Not started</option>
        <option value="in_progress">In progress</option>
        <option value="finished">Finished</option>
      </select>
      <select id="filter-assigned" class="filter-select">
        <option value="all">Assigned to: All</option>
        <option value="mine">Only assigned to me</option>
      </select>
      <select id="filter-all-available" class="filter-select">
        <option value="all">All datasets available: All</option>
        <option value="yes">All available</option>
        <option value="no">Not all available</option>
      </select>
      <select id="filter-all-on-modal" class="filter-select">
        <option value="all">All datasets on Modal: All</option>
        <option value="yes">All on Modal</option>
        <option value="no">Not all on Modal</option>
      </select>
      <button id="clear-filters-btn" class="btn-secondary filter-bar-right">&times; Clear filters</button>
    </div>

    <div id="results-count" class="results-count hidden"></div>

    <table class="papers-table">
      <thead>
        <tr>
          <th>Paper ID</th>
          <th>Title</th>
          <th>Assignees</th>
          <th>Reproduction status</th>
          <th>All Datasets Available</th>
          <th>All Datasets On Modal</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="papers-tbody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/reproduction/reproduction-overview.js"></script>
</body>
</html>
