<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Dataset Confirmation Tracker</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current">Dataset Confirmation Tracker</span>
      </nav>
      <div class="header-actions">
        <div class="account-menu">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div id="stats-row" class="stats-row"></div>

    <div class="filter-bar">
      <div class="status-filters">
        <button class="filter-btn active" data-confirmation="all">All</button>
        <button class="filter-btn" data-confirmation="confirmed">Confirmed</button>
        <button class="filter-btn" data-confirmation="not_confirmed">Unconfirmed</button>
      </div>
      <button id="export-json-btn" class="btn-secondary filter-bar-right">Download JSON</button>
    </div>

    <table class="papers-table">
      <thead>
        <tr>
          <th>Paper ID</th>
          <th>Title</th>
          <th>Datasets</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="papers-tbody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dataset-confirmation/dataset-confirmation-overview.js"></script>
</body>
</html>
