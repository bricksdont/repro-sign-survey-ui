<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLP Paper Survey — Signing in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f6f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .login-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 36px 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
    .status { margin: 12px 0 0; font-size: 13px; color: #666; }
    .error-msg {
      display: none;
      background: #fde8e8;
      border: 1px solid #f5c6c6;
      color: #b91c1c;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 13px;
      margin: 16px 0 0;
      text-align: left;
    }
    .error-msg.visible { display: block; }
    .footer-link { margin: 18px 0 0; font-size: 13px; color: #666; }
    .footer-link a { color: #4a6fa5; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .spinner {
      width: 26px;
      height: 26px;
      margin: 8px auto 0;
      border: 3px solid #e2e2e2;
      border-top-color: #4a6fa5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>SLP Paper Survey</h1>
    <div id="spinner" class="spinner"></div>
    <p class="status" id="status">Completing sign-in…</p>
    <div id="error-msg" class="error-msg"></div>
    <p class="footer-link" id="retry" style="display:none;"><a href="login.html">Back to sign in</a></p>
  </div>
  <script src="js/api.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById('status');
      const errEl = document.getElementById('error-msg');
      const spinner = document.getElementById('spinner');
      try {
        const next = await completeOAuth2();
        statusEl.textContent = 'Signed in. Redirecting…';
        window.location.href = next;
      } catch (err) {
        spinner.style.display = 'none';
        statusEl.textContent = 'Sign-in failed.';
        errEl.textContent = err.message || 'Could not complete sign-in.';
        errEl.classList.add('visible');
        document.getElementById('retry').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
