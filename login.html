<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLP Paper Survey — Login</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f6f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .login-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 36px 40px;
      width: 360px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      color: #666;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: #4a6fa5;
      box-shadow: 0 0 0 2px rgba(74,111,165,0.2);
    }
    button[type="submit"] {
      width: 100%;
      padding: 9px;
      background: #4a6fa5;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #3d5d8f; }
    button[type="submit"]:disabled { background: #999; cursor: default; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #999;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e2e2;
    }
    .oauth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .oauth-btn:hover { background: #f7f7f7; }
    .oauth-btn:disabled { opacity: 0.6; cursor: default; }
    .oauth-btn svg { width: 18px; height: 18px; }
    .error-msg {
      display: none;
      background: #fde8e8;
      border: 1px solid #f5c6c6;
      color: #b91c1c;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>SLP Paper Survey</h1>
    <p class="subtitle">Sign in to continue</p>
    <div id="error-msg" class="error-msg">Incorrect email or password.</div>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <div class="divider" id="oauth-divider" style="display:none">or</div>
    <button type="button" class="oauth-btn" id="slack-btn" style="display:none">
      <svg viewBox="0 0 122.8 122.8" aria-hidden="true">
        <path d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zm6.5 0c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z" fill="#E01E5A"/>
        <path d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zm0 6.5c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z" fill="#36C5F0"/>
        <path d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zm-6.5 0c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z" fill="#2EB67D"/>
        <path d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zm0-6.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z" fill="#ECB22E"/>
      </svg>
      Sign in with Slack
    </button>
  </div>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const next = sameOriginNext(params.get('next'));

    // Already logged in with a valid token? Skip the form.
    if (isAuthenticated()) {
      window.location.href = next;
    }

    // Only surface "Sign in with Slack" if the oidc provider (Slack sits in the
    // generic oidc slot) is actually registered on the backend.
    (async () => {
      try {
        const providers = await listOAuth2Providers();
        if (providers.some(p => p.name === 'oidc')) {
          document.getElementById('oauth-divider').style.display = 'flex';
          document.getElementById('slack-btn').style.display = 'flex';
        }
      } catch {
        // Backend unreachable or no OAuth configured — leave the button hidden.
      }
    })();

    document.getElementById('slack-btn').addEventListener('click', async () => {
      const btn = document.getElementById('slack-btn');
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('visible');
      errEl.textContent = '';
      btn.disabled = true;
      try {
        await startOAuth2('oidc', next);
      } catch (err) {
        errEl.textContent = err.message || 'Could not start Slack sign-in.';
        errEl.classList.add('visible');
        btn.disabled = false;
      }
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errEl.classList.remove('visible');
      errEl.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        let res;
        try {
          res = await fetch(
            `${PB_URL}/api/collections/users/auth-with-password`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identity: email, password }),
            }
          );
        } catch {
          errEl.textContent = `Cannot reach backend (${PB_URL}). Is it running?`;
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }
        if (!res.ok) throw new Error('auth failed');
        const { token, record } = await res.json();
        localStorage.setItem('pb_token', token);
        localStorage.setItem('pb_user_id', record.id);
        localStorage.setItem('pb_token_expiry', String(Date.now() + SESSION_TTL_MS));
        localStorage.setItem('pb_email', email);
        window.location.href = next;
      } catch {
        errEl.textContent = 'Incorrect email or password.';
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
