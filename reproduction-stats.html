<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Reproduction Stats</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview stats-page">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current">Reproduction Stats</span>
      </nav>
      <div class="header-actions">
        <div class="account-menu">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-subnav status-filters">
      <a href="stats.html" class="filter-btn">Reviewing</a>
      <a href="dataset-stats.html" class="filter-btn">Datasets</a>
      <a href="reproduction-stats.html" class="filter-btn active">Reproduction</a>
    </div>

    <div id="stats-summary" class="stats-row"></div>

    <div class="stats-section">
      <div class="stats-section-title">Reproduction Status</div>
      <div id="status-breakdown"></div>
    </div>

    <div class="stats-section">
      <div class="stats-section-title">Top Assignees</div>
      <div id="top-assignees"></div>
    </div>

    <div class="stats-section">
      <div class="stats-section-title">All Datasets Available</div>
      <div id="all-available-breakdown"></div>
    </div>

    <div class="stats-section">
      <div class="stats-section-title">All Datasets On Modal</div>
      <div id="all-on-modal-breakdown"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/stats/stats-shared.js"></script>
  <script src="js/stats/reproduction-stats.js"></script>
</body>
</html>
