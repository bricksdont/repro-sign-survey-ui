<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Dataset</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <a href="datasets-index.html" class="breadcrumb-link">Datasets</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current" id="breadcrumb-name">&#8230;</span>
      </nav>
      <div class="account-menu">
        <button id="account-btn" class="btn-account">Account</button>
        <div id="account-dropdown" class="account-dropdown hidden">
          <div id="account-email" class="account-email"></div>
          <hr class="account-divider">
          <button id="logout-btn" class="btn-logout">Log out</button>
        </div>
      </div>
    </div>

    <div id="locked-notice" class="locked-notice hidden">This dataset is being edited by another user.</div>

    <div class="dataset-form detail-form">
      <div class="dataset-form-group">
        <label class="dataset-form-label" for="field-name">Name <span class="required-star">*</span></label>
        <input type="text" id="field-name" class="field-input" placeholder="e.g. PHOENIX-2014">
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label" for="field-license">License</label>
        <input type="text" id="field-license" class="field-input" placeholder="e.g. CC BY-SA 4.0">
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">URLs</label>
        <div id="url-chips" class="chip-container"></div>
        <div class="tag-input-row">
          <input type="text" id="url-input" class="field-input" placeholder="https://…">
          <button id="add-url-btn" class="btn-secondary">Add</button>
        </div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">Available</label>
        <div class="dataset-radio-group">
          <label><input type="radio" name="available" value="yes"> Yes</label>
          <label><input type="radio" name="available" value="no"> No</label>
          <label><input type="radio" name="available" value=""> Not answered</label>
        </div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">
          On Modal
          <span class="info-wrap"><button type="button" class="info-btn" aria-label="Info">&#9432;</button><span class="info-popup">Whether this dataset is already stored on the compute platform Modal.com.</span></span>
        </label>
        <div class="dataset-radio-group">
          <label><input type="radio" name="on_modal" value="yes"> Yes</label>
          <label><input type="radio" name="on_modal" value="no"> No</label>
          <label><input type="radio" name="on_modal" value=""> Not answered</label>
        </div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label">
          Correspondence
          <span class="info-wrap"><button type="button" class="info-btn" aria-label="Info">&#9432;</button><span class="info-popup">Status of reaching out to this dataset's original owners, e.g. about access or licensing.</span></span>
        </label>
        <div class="dataset-radio-group">
          <label><input type="radio" name="correspondence" value="contacted_got_reply"> Contacted, got reply</label>
          <label><input type="radio" name="correspondence" value="contacted_waiting"> Contacted, awaiting reply</label>
          <label><input type="radio" name="correspondence" value=""> Not contacted yet</label>
        </div>
      </div>
      <div class="dataset-form-group">
        <label class="dataset-form-label" for="field-comments">Comments</label>
        <textarea id="field-comments" class="field-input dataset-textarea" rows="4" placeholder="Any notes about this dataset…"></textarea>
      </div>
    </div>

    <div id="used-in-papers-section" class="stats-section detail-form hidden">
      <div class="stats-section-title">Used in Papers</div>
      <div id="used-in-papers-list" class="used-in-papers-list"></div>
    </div>

    <div class="detail-footer">
      <a href="datasets-index.html" class="back-link">&#8592; Back</a>
      <div class="detail-footer-right">
        <span id="save-confirm" class="save-confirm hidden">Saved ✓</span>
        <button id="save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/datasets/dataset-detail.js"></script>
</body>
</html>
