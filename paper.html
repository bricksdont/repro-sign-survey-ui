<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Left panel: PDF viewer (native browser viewer via proxy iframe) -->
    <div class="panel pdf-panel">
      <iframe id="pdf-iframe" title="PDF viewer"></iframe>
    </div>

    <!-- Draggable divider -->
    <div id="divider"></div>

    <!-- Right panel: Metadata form -->
    <div class="panel meta-panel">

      <div class="meta-header">
        <div class="meta-header-left">
          <a href="review-index.html" class="back-link">&#8592; Overview</a>
          <button id="copy-link-btn" class="copy-link-btn" title="Copy link to this paper">&#128279; Copy link</button>
          <button id="status-history-btn" class="copy-link-btn" title="View status change history">&#128340; Status History</button>
        </div>
        <div class="paper-nav">
          <button id="prev-paper" title="Previous paper" disabled>&#9664;</button>
          <span id="paper-counter">1 / 1</span>
          <button id="next-paper" title="Next paper" disabled>&#9654;</button>
        </div>
      </div>

      <div id="locked-notice" class="locked-notice hidden">This paper is being reviewed by another user.</div>

      <div class="status-row">
        <span id="status-badge" class="status-badge status-needs-review">&#9679; Needs Review</span>
        <span id="finalized-by-label" class="status-reason hidden"></span>
        <button id="clear-status-btn" class="clear-status-btn hidden" aria-label="Clear status"></button>
      </div>

      <!-- Title -->
      <div class="field-group">
        <label>Title</label>
        <div class="field-row">
          <span class="field-display" id="display-title"></span>
          <input type="text" class="field-input hidden" id="input-title" placeholder="Paper title">
          <button class="edit-btn hidden" id="edit-title" title="Edit">&#9998;</button>
        </div>
      </div>

      <!-- Year -->
      <div class="field-group">
        <label>Year</label>
        <div class="field-row">
          <span class="field-display" id="display-year"></span>
          <input type="number" class="field-input hidden" id="input-year" placeholder="e.g. 2024" min="1900" max="2100">
          <button class="edit-btn hidden" id="edit-year" title="Edit">&#9998;</button>
        </div>
      </div>

      <!-- Venue -->
      <div class="field-group">
        <label>Venue</label>
        <div class="field-row">
          <span class="field-display" id="display-venue"></span>
          <input type="text" class="field-input hidden" id="input-venue" placeholder="e.g. EMNLP, ACL, NAACL">
          <button class="edit-btn hidden" id="edit-venue" title="Edit">&#9998;</button>
        </div>
      </div>

      <!-- Peer-reviewed -->
      <div class="field-group">
        <label>Peer-Reviewed</label>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="peer-reviewed" value="yes"> Yes
          </label>
          <label class="radio-option">
            <input type="radio" name="peer-reviewed" value="no"> No
          </label>
          <label class="radio-option">
            <input type="radio" name="peer-reviewed" value="na"> N/A
          </label>
        </div>
      </div>

      <!-- Area of SLP -->
      <div class="field-group">
        <label>Area of SLP</label>
        <div class="tag-container" id="area-of-slp-container"></div>
        <div class="tag-input-wrapper">
          <div class="tag-input-row">
            <input type="text" id="area-of-slp-input" placeholder="Add area…" autocomplete="off">
            <button id="add-area-of-slp-btn">+ Add</button>
          </div>
          <div id="area-of-slp-suggestions" class="suggestions-dropdown hidden"></div>
        </div>
      </div>

      <!-- Ethical concerns -->
      <div class="field-group">
        <label class="field-label-primary">
          Potential Ethical Concerns
          <span class="info-wrap"><button type="button" class="info-btn" aria-label="Info">&#9432;</button><span class="info-popup">Choose yes if the paper uses e.g. derogatory / ableist language.</span></span>
        </label>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="ethical-concerns" value="yes"> Yes
          </label>
          <label class="radio-option">
            <input type="radio" name="ethical-concerns" value="no"> No
          </label>
        </div>
      </div>

      <hr class="field-divider">

      <!-- Code repositories -->
      <div class="field-group">
        <label>Code Repositories</label>
        <div class="tag-container" id="code-repos-container"></div>
        <div class="tag-input-row">
          <input type="url" id="code-repo-input" placeholder="https://github.com/…" autocomplete="off">
          <button id="add-code-repo-btn">+ Add</button>
        </div>
        <button type="button" id="code-repos-na-btn" class="na-toggle-btn" aria-pressed="false">
          <span class="na-toggle-icon">&#9744;</span> I confirm that there are no code repositories available.
        </button>
      </div>

      <!-- Datasets -->
      <div class="field-group">
        <label>Datasets</label>
        <div class="tag-container" id="datasets-container"></div>
        <div class="tag-input-wrapper">
          <div class="tag-input-row">
            <input type="text" id="dataset-input" placeholder="Add dataset…" autocomplete="off">
            <button id="add-dataset-btn">+ Add</button>
          </div>
          <div id="dataset-suggestions" class="suggestions-dropdown hidden"></div>
        </div>
      </div>

      <!-- Metrics -->
      <div class="field-group">
        <label>Metrics</label>
        <div class="tag-container" id="metrics-container"></div>
        <div class="tag-input-wrapper">
          <div class="tag-input-row">
            <input type="text" id="metric-input" placeholder="Add metric…" autocomplete="off">
            <button id="add-metric-btn">+ Add</button>
          </div>
          <div id="metric-suggestions" class="suggestions-dropdown hidden"></div>
        </div>
      </div>

      <hr class="field-divider">

      <!-- Main experiment has a ranking -->
      <div class="field-group">
        <label class="field-label-primary">Main Experiment Has a Ranking</label>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="has-ranking" value="yes"> Yes
          </label>
          <label class="radio-option">
            <input type="radio" name="has-ranking" value="no"> No
          </label>
        </div>
      </div>

      <!-- Copied baseline scores -->
      <div class="field-group">
        <label class="field-label-primary">
          Copied Baseline Scores
          <span class="info-wrap"><button type="button" class="info-btn" aria-label="Info">&#9432;</button><span class="info-popup">Yes if at least one score of the main experiment is copied from a different paper.</span></span>
        </label>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="copied-scores" value="yes"> Yes
          </label>
          <label class="radio-option">
            <input type="radio" name="copied-scores" value="no"> No
          </label>
        </div>
      </div>

      <!-- Includes human evaluation -->
      <div class="field-group">
        <label class="field-label-primary">Includes Human Evaluation</label>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="human-evaluation" value="yes"> Yes
          </label>
          <label class="radio-option">
            <input type="radio" name="human-evaluation" value="no"> No
          </label>
        </div>
      </div>

      <!-- What to reproduce -->
      <div class="field-group">
        <label class="field-label-primary">
          What to Reproduce
          <span class="info-wrap"><button type="button" class="info-btn" aria-label="Info">&#9432;</button><span class="info-popup">Insert pointer to table(s) or figure(s) that team R has to reproduce.</span></span>
        </label>
        <textarea id="input-what-to-reproduce" class="field-textarea" rows="3" placeholder="e.g. Table 3, Figure 2"></textarea>
      </div>

      <!-- Compute requirements -->
      <div class="field-group">
        <label class="field-label-primary">
          Compute Requirements
          <span class="info-wrap"><button type="button" class="info-btn" aria-label="Info">&#9432;</button><span class="info-popup">Leave empty if not specified in paper.</span></span>
        </label>
        <textarea id="input-compute-requirements" class="field-textarea" rows="2" placeholder="e.g. 4x V100 GPUs, 48 hours"></textarea>
        <button type="button" id="compute-requirements-na-btn" class="na-toggle-btn" aria-pressed="false">
          <span class="na-toggle-icon">&#9744;</span> I confirm that the compute requirements were not specified in the paper.
        </button>
      </div>

      <!-- Textual conclusion -->
      <div class="field-group">
        <label class="field-label-primary">Textual Conclusion</label>
        <textarea id="input-textual-conclusion" class="field-textarea" rows="4" placeholder="Copy-paste the main conclusion from the paper"></textarea>
      </div>

      <div class="form-footer">
        <span class="finalize-tooltip-wrap">
          <button id="finalize-btn" class="btn-secondary" disabled>Finalize</button>
          <span id="finalize-tooltip" class="info-popup"></span>
        </span>
        <span class="finalize-tooltip-wrap">
          <button id="finalize-next-btn" class="btn-primary" disabled>Finalize &amp; Next &#8594;</button>
          <span id="finalize-next-tooltip" class="info-popup"></span>
        </span>
        <button id="flag-btn" class="btn-flag">Flag</button>
        <button id="reject-btn" class="btn-danger">Reject</button>
        <span id="save-indicator" class="save-indicator hidden"></span>
      </div>

    </div>

  </div>

  <!-- Flag dialog -->
  <div id="flag-overlay" class="modal-overlay hidden">
    <div class="modal-dialog">
      <h3 class="modal-title">Flag Paper</h3>
      <p class="modal-subtitle">Select a reason for flagging:</p>
      <div class="reject-options">
        <label class="reject-option">
          <input type="radio" name="flag-reason" value="Unclear which experiment is the main one">
          Unclear which experiment is the main one
        </label>
        <label class="reject-option">
          <input type="radio" name="flag-reason" value="Unclear if method is computational">
          Unclear if method is computational
        </label>
        <label class="reject-option">
          <input type="radio" name="flag-reason" value="Conflict of interest">
          Conflict of interest
        </label>
        <label class="reject-option">
          <input type="radio" name="flag-reason" value="other">
          Other (explain):
        </label>
        <textarea id="flag-other-text" class="reject-other-text hidden" placeholder="Describe the reason&#8230;" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button id="flag-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="flag-confirm-btn" class="btn-flag" disabled>Flag</button>
      </div>
    </div>
  </div>

  <!-- Rejection dialog -->
  <div id="reject-overlay" class="modal-overlay hidden">
    <div class="modal-dialog">
      <h3 class="modal-title">Reject Paper</h3>
      <p class="modal-subtitle">Select a reason for rejection:</p>
      <div class="reject-options">
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="Paper is not on Sign Language Processing">
          Paper is not on Sign Language Processing
        </label>
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="Does not have quantitative experiments">
          Does not have quantitative experiments
        </label>
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="Not published between 2017 and 2026">
          Not published between 2017 and 2026
        </label>
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="The paper is not in English">
          The paper is not in English
        </label>
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="No full text PDF could be found">
          No full text PDF could be found
        </label>
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="Requires specialized hardware">
          Requires specialized hardware
        </label>
        <label class="reject-option">
          <input type="radio" name="reject-reason" value="other">
          Other (explain):
        </label>
        <textarea id="reject-other-text" class="reject-other-text hidden" placeholder="Describe the reason&#8230;" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button id="reject-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="reject-confirm-btn" class="btn-danger" disabled>Reject</button>
      </div>
    </div>
  </div>

  <!-- Status history dialog -->
  <div id="status-history-overlay" class="modal-overlay hidden">
    <div class="modal-dialog status-history-dialog">
      <h3 class="modal-title">Status History</h3>
      <div id="status-history-list" class="status-history-list"></div>
      <div class="modal-footer">
        <button id="status-history-close-btn" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <a id="version-badge" class="version-badge hidden">
    <img src="https://github.githubassets.com/favicons/favicon.svg" alt="" class="version-badge-icon">
    <span id="version-badge-text"></span>
  </a>

  <script src="js/api.js"></script>
  <script src="js/review/app.js"></script>
</body>
</html>
