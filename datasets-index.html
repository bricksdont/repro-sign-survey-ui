<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRO-SIGN Survey Tool — Datasets</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overview overview-wide">
    <div class="overview-header">
      <nav class="breadcrumb">
        <a href="index.html" class="breadcrumb-link">Home</a>
        <span class="breadcrumb-sep">&#8594;</span>
        <span class="breadcrumb-current">Datasets</span>
      </nav>
      <div class="header-actions">
        <div class="account-menu">
          <button id="account-btn" class="btn-account">Account</button>
          <div id="account-dropdown" class="account-dropdown hidden">
            <div id="account-email" class="account-email"></div>
            <hr class="account-divider">
            <button id="logout-btn" class="btn-logout">Log out</button>
          </div>
        </div>
        <a href="dataset.html" class="btn-primary btn-primary-link">+ Add Dataset</a>
      </div>
    </div>

    <div id="stats-row" class="stats-row"></div>

    <div class="filter-bar">
      <div class="search-input-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Search by name…">
        <button id="search-clear-btn" class="search-clear-btn hidden" type="button" aria-label="Clear search">&times;</button>
      </div>
      <select id="filter-available" class="filter-select">
        <option value="all">Availability: All</option>
        <option value="yes">Available</option>
        <option value="no">Not available</option>
        <option value="unanswered">Unanswered</option>
      </select>
      <select id="filter-on-modal" class="filter-select">
        <option value="all">On Modal: All</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
        <option value="unanswered">Unanswered</option>
      </select>
      <select id="filter-correspondence" class="filter-select">
        <option value="all">Correspondence: All</option>
        <option value="got_reply">Got reply</option>
        <option value="waiting">Awaiting reply</option>
        <option value="not_contacted">Not contacted</option>
      </select>
      <select id="filter-orphan" class="filter-select">
        <option value="all">Orphans: All</option>
        <option value="only">Orphaned only</option>
        <option value="hide">Hide orphaned</option>
      </select>
      <select id="filter-final" class="filter-select">
        <option value="all">Final paper: All</option>
        <option value="only">Used in a Final paper</option>
      </select>
      <button id="clear-filters-btn" class="btn-secondary filter-bar-right">&times; Clear filters</button>
    </div>

    <div id="results-count" class="results-count hidden"></div>

    <table class="papers-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>License</th>
          <th>Available</th>
          <th>On Modal</th>
          <th>Correspondence</th>
          <th>URL</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="datasets-tbody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/datasets/datasets-overview.js"></script>
</body>
</html>
